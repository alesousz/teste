<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de Cenas — Ferramenta Interna</title>
  <link rel="stylesheet" href="editor-style.css?v=4" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="editor-canvas"></canvas>

  <div id="editor-ui">
    <div id="palette-panel">
      <div id="palette-sidebar">
        <h3>Catálogo</h3>
        <button class="cat-btn active">Tudo</button>
        <div style="flex-grow: 1;"></div>
        <div class="hint">Teclas 1-9, 0 para atalhos</div>
        <div class="hint">Esc — soltar item</div>
      </div>
      <div id="palette-content">
        <div id="palette-header">
          <input type="text" id="palette-search" placeholder="Pesquisar..." autocomplete="off" />
        </div>
        <div id="palette-list"></div>
      </div>
    </div>

    <div id="props-panel" class="hidden"></div>

    <div id="hud-hint">
      <div id="crosshair"></div>
    </div>
    
    <div id="top-toolbar">
      <button class="tool-btn active" id="btn-tool-select" title="Selecionar (Esc)">🖐️ Selecionar</button>
      <button class="tool-btn" id="btn-tool-demolish" title="Marreta (Del)">🔨 Demolir</button>
      <button class="tool-btn" id="btn-demo-room" style="background:#4CAF50;color:white;font-weight:bold;margin-left:20px;">✨ Construir Casa AAA</button>
    </div>

    <div id="controls-hint">
      WASD mover · Q/E descer/subir · Shift correr (e ignorar lugar ocupado) · Clique esquerdo colocar/selecionar ·
      R girar · PgUp/PgDn andar · Delete excluir · Tab menu de cenas
    </div>

    <div id="scene-panel" class="hidden">
      <h3>Cenas</h3>
      <input id="scene-name" type="text" placeholder="Nome da cena" />
      <div class="scene-buttons">
        <button id="btn-save-scene">Salvar</button>
        <button id="btn-new-scene">Nova</button>
        <button id="btn-load-game-scene">Carregar cena atual do jogo</button>
        <button id="btn-export-scene">Exportar JSON</button>
      </div>
      <div id="scene-list"></div>
      <textarea id="export-output" class="hidden" readonly></textarea>
      <p class="hint">Pressione Tab para fechar</p>
    </div>
  </div>

  <script type="module" src="src/editor/main.js?v=13"></script>
</body>
</html>
